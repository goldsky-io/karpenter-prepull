image:
  repository: ghcr.io/goldsky-io/karpenter-prepull
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# One replica starts pull pods. Every replica serves the eviction webhook.
# While no replica runs, Karpenter drains nodes as it does without this chart.
replicas: 2

# Names of the Karpenter NodePools to act on. Empty means every NodePool.
# Drains of nodes in other NodePools are not warmed for and not held.
nodePools: []

# Longest time evictions are held after a drain starts.
timeout: 2m

# Warm only nodes younger than this. Zero warms every node that the pods of a
# draining node fit, at the cost of more pulls.
targetNodeMaxAge: 15m

webhook:
  # Seconds the API server waits for the webhook before it lets the eviction pass.
  timeoutSeconds: 2

# Most images one pull pod pulls.
maxImages: 30

# Startup taint keys of other components (a CNI or CSI agent, for example).
# Without this, a pod that does not tolerate such a taint is not counted as a
# future tenant of the new node.
ignoreTaintKeys: []

pullPod:
  # A host network pod does not wait for the CNI to give it an IP, which saves
  # time on a node that is still starting. The baseline Pod Security Standard
  # forbids host network pods, so this is off by default.
  hostNetwork: false
  priorityClassName: ""

otlp:
  # Base URL of an OTLP/HTTP endpoint, for example http://collector:4318.
  # When set, the metrics are also pushed there. The Prometheus endpoint stays.
  endpoint: ""

extraArgs: []

# Extra environment variables, for example other OTEL_* settings.
extraEnv: []

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceAccount:
  annotations: {}
